name: Keep Streamlit Awake

on:
  schedule:
    - cron: "17 */6 * * *"

  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Visit Streamlit app
        run: |
          STATUS=$(curl \
            --silent \
            --show-error \
            --output /dev/null \
            --write-out "%{http_code}" \
            --max-time 60 \
            "https://ai-portfolio-opt-dashboard.streamlit.app/")

          echo "HTTP status: $STATUS"

          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            exit 0
          else
            exit 1
          fi
