name: Keep Streamlit Awake

on:
  schedule:
    - cron: "17 */6 * * *"

  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Visit Streamlit app
        run: |
          curl -L \
            --fail \
            --retry 3 \
            --max-time 60 \
            "https://ai-portfolio-opt-dashboard.streamlit.app/"
